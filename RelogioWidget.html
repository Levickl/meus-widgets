<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Minimalista</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #202020;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;
        }

        .clock-widget {
            width: 320px;
            padding: 28px 32px;

            background: #121217;
            border: 1px solid #24242c;
            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .time {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            font-size: 42px;
            font-weight: 600;
            letter-spacing: 2px;

            font-variant-numeric: tabular-nums;
        }

        .separator {
            opacity: 0.35;
            margin-bottom: 3px;
        }

        .time-value {
            position: relative;
            display: inline-block;

            min-width: 55px;
            height: 52px;

            overflow: hidden;
        }

        .number {
            display: block;

            width: 100%;
            height: 52px;

            line-height: 52px;

            transition:
                transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.35s ease;
        }

        .number.change {
            animation: numberChange 0.4s ease;
        }

        @keyframes numberChange {
            0% {
                transform: translateY(-14px);
                opacity: 0;
            }

            45% {
                transform: translateY(3px);
                opacity: 0.7;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .date {
            margin-top: 12px;

            color: #858590;

            font-size: 14px;
            font-weight: 400;

            letter-spacing: 1.5px;
        }
    </style>
</head>

<body>

    <div class="clock-widget">

        <div class="time">

            <div class="time-value">
                <span id="hours" class="number">00</span>
            </div>

            <span class="separator">:</span>

            <div class="time-value">
                <span id="minutes" class="number">00</span>
            </div>

            <span class="separator">:</span>

            <div class="time-value">
                <span id="seconds" class="number">00</span>
            </div>

        </div>

        <div id="date" class="date">
            
        </div>

    </div>


    <script>
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");
        const dateElement = document.getElementById("date");


        function formatNumber(number) {
            return String(number).padStart(2, "0");
        }


        function updateElement(element, value) {

            if (element.textContent === value) {
                return;
            }

            element.classList.remove("change");

            // Reinicia a animação
            void element.offsetWidth;

            element.textContent = value;
            element.classList.add("change");
        }


        function updateClock() {

            const now = new Date();

            const hours = formatNumber(now.getHours());
            const minutes = formatNumber(now.getMinutes());
            const seconds = formatNumber(now.getSeconds());

            const day = formatNumber(now.getDate());
            const month = formatNumber(now.getMonth() + 1);
            const year = now.getFullYear();


            updateElement(hoursElement, hours);
            updateElement(minutesElement, minutes);
            updateElement(secondsElement, seconds);


            dateElement.textContent = `${day}/${month}/${year}`;
        }


        updateClock();

        setInterval(updateClock, 1000);
    </script>

</body>
</html>
