        .lista{
            display: flex;
            align-items: center;
            font-size: large;
            font-weight: bold;
            background-color: #ffd414;
            padding-bottom: 20px;
            padding-top: 20px;
            padding-inline: 60px;
            border-radius: 7px;
            gap: 10px;
            flex-direction: column;
            box-shadow: 0px 1px 10px rgba(251, 255, 31, 0.61);
        }

    </style>
</head>
